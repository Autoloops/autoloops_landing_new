[build]
  base = "frontend"
  command = "npm ci --legacy-peer-deps && npm run build"
  publish = "build"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"
  NETLIFY_USE_YARN = "false"
  NODE_OPTIONS = "--max-old-space-size=4096"

# Set WAITLIST_VIEW_KEY, SUPABASE_URL, and SUPABASE_SERVICE_ROLE_KEY
# in the Netlify UI (Site settings → Environment variables).
# Do not put secrets in this file.
# Paths are relative to [build].base (frontend/). The default would
# also be netlify/functions; do not prefix with frontend/ again or
# the waitlist function never deploys and /api/waitlist 404s as HTML.
[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/api/waitlist"
  to = "/.netlify/functions/waitlist"
  status = 200
  force = true
